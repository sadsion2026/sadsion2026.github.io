<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#87b8e8" />
<title>صيد الطيور — Bird Hunter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #6fb3e6; touch-action: none; overscroll-behavior: none;
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    user-select: none; -webkit-user-select: none;
    cursor: crosshair;
  }
  #game { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    color: #fff; z-index: 10; cursor: default;
    padding: calc(env(safe-area-inset-top) + 10px) 6vw calc(env(safe-area-inset-bottom) + 10px);
    background: linear-gradient(180deg, rgba(20,50,90,.45), rgba(20,50,90,.82) 70%); backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: clamp(38px, 11vw, 92px); font-weight: 900; letter-spacing: 1px; line-height: 1.04;
    color: #ffd23f; margin-bottom: 6px; text-shadow: 0 0 18px rgba(255,180,60,.7), 0 0 42px rgba(255,120,40,.4), 0 5px 0 #a9560a;
  }
  .subtitle { font-size: clamp(14px, 3.8vw, 23px); color: #e6f2ff; margin-bottom: 30px; letter-spacing:.5px; }
  .btn {
    font-family: inherit; font-size: clamp(19px, 5vw, 27px); font-weight: 800; color: #17324d;
    background: linear-gradient(180deg, #ffd23f, #ff9a1f); border: none; border-radius: 15px;
    padding: 15px 40px; cursor: pointer; margin: 8px 0; min-width: 250px;
    box-shadow: 0 7px 0 #b85e00, 0 14px 28px rgba(0,0,0,.4); transition: transform .06s, box-shadow .06s;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #b85e00, 0 8px 14px rgba(0,0,0,.4); }
  .btn.secondary { color: #fff; background: linear-gradient(180deg, #4a90d9, #2a63a8); box-shadow: 0 7px 0 #163c66, 0 14px 28px rgba(0,0,0,.4); }
  .btn.secondary:active { box-shadow: 0 2px 0 #163c66, 0 8px 14px rgba(0,0,0,.4); }
  .hint { margin-top: 24px; font-size: clamp(13px, 3.3vw, 18px); color: #dcecff; line-height: 1.9; max-width: 580px; }
  .hint b { color: #ffd23f; }
  .score-big { font-size: clamp(28px, 8vw, 52px); font-weight: 900; color: #ffd23f; margin: 6px 0 2px; }
  .best { color: #cfe4ff; font-size: clamp(14px, 3.6vw, 20px); margin-bottom: 22px; }
  .panel { background: rgba(20,50,90,.5); border: 1px solid rgba(255,255,255,.22); border-radius: 18px; padding: 8px 22px; width: min(450px, 88vw); margin-bottom: 18px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 15px 4px; border-bottom: 1px solid rgba(255,255,255,.15); font-size: clamp(16px, 4.4vw, 22px); font-weight: 700; color: #eaf4ff; }
  .row:last-child { border-bottom: none; }
  .toggle { position: relative; width: 64px; height: 34px; border-radius: 20px; background: #3a5a7e; transition: background .2s; cursor: pointer; flex: 0 0 auto; }
  .toggle.on { background: #ff9a1f; }
  .toggle::after { content: ""; position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .toggle.on::after { transform: translateX(-30px); }
  .seg { display: flex; gap: 6px; }
  .seg button { font-family: inherit; font-size: clamp(13px,3.6vw,17px); font-weight: 800; color: #cfe4ff; background: #2a4a6e; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  .seg button.active { background: #ff9a1f; color: #17324d; border-color: #ff9a1f; }
  .credit { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 11px; color: rgba(255,255,255,.5); z-index: 11; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- شاشة البداية -->
<div id="startScreen" class="overlay">
  <div class="title">🦆 صيد الطيور</div>
  <div class="subtitle">اضغط على الطيور قبل أن تهرب!</div>
  <button class="btn" id="playBtn">ابدأ اللعب</button>
  <button class="btn secondary" id="settingsBtn">الإعدادات</button>
  <div class="hint">
    🎯 <b>اضغط</b> على أي طائر لإسقاطه<br>
    ⏳ لديك <b>ذخيرة محدودة</b> — لا تهدرها<br>
    ❤️ كل طائر يهرب يكلّفك <b>حياة</b><br>
    ⭐ الطيور الذهبية = <b>نقاط مضاعفة + ذخيرة</b>
  </div>
</div>

<!-- شاشة الإعدادات -->
<div id="settingsScreen" class="overlay hidden">
  <div class="title" style="font-size:clamp(30px,8vw,60px)">الإعدادات</div>
  <div class="panel">
    <div class="row">
      <span>🔊 الصوت</span>
      <div class="toggle on" id="soundToggle"></div>
    </div>
    <div class="row">
      <span>⚙️ الصعوبة</span>
      <div class="seg" id="diffSeg">
        <button data-d="easy">سهل</button>
        <button data-d="normal" class="active">عادي</button>
        <button data-d="hard">صعب</button>
      </div>
    </div>
  </div>
  <button class="btn" id="backBtn">رجوع</button>
</div>

<!-- شاشة النهاية -->
<div id="overScreen" class="overlay hidden">
  <div class="title" style="color:#ff6b5a">انتهت اللعبة</div>
  <div class="score-big" id="finalScore">النتيجة: 0</div>
  <div class="best" id="bestScore">أفضل نتيجة: 0</div>
  <button class="btn" id="retryBtn">إعادة اللعب</button>
  <button class="btn secondary" id="menuBtn">القائمة الرئيسية</button>
</div>

<div class="credit">صيد الطيور — Bird Hunter · اضغط لتطلق</div>

<script>
"use strict";
(function () {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  // ---------- الحالة ----------
  let W = 0, H = 0, DPR = 1;
  const state = {
    scene: "start",           // start | play | over
    score: 0,
    lives: 3,
    ammo: 6,
    maxAmmo: 6,
    reloadT: 0,
    wave: 1,
    birds: [],
    particles: [],
    floaters: [],             // نصوص متطايرة (+10 …)
    clouds: [],
    spawnT: 0,
    shakeT: 0,
    sound: true,
    diff: "normal",
    best: 0,
    time: 0,
    combo: 0,
    comboT: 0,
  };

  const DIFF = {
    easy:   { spawn: 1.5, speed: 0.8, ammo: 8, escapePenalty: 1 },
    normal: { spawn: 1.1, speed: 1.0, ammo: 6, escapePenalty: 1 },
    hard:   { spawn: 0.75, speed: 1.35, ammo: 5, escapePenalty: 1 },
  };

  try {
    state.best = parseInt(localStorage.getItem("birdhunter_best") || "0", 10) || 0;
    const s = localStorage.getItem("birdhunter_sound");
    if (s !== null) state.sound = s === "1";
    const d = localStorage.getItem("birdhunter_diff");
    if (d && DIFF[d]) state.diff = d;
  } catch (e) {}

  // ---------- الصوت (WebAudio) ----------
  let AC = null;
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === "suspended") AC.resume();
    return AC;
  }
  function beep(freq, dur, type, vol, slideTo) {
    if (!state.sound) return;
    const a = ac(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime((vol || 0.2), a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + 0.02);
  }
  function sShoot() { beep(220, 0.08, "square", 0.18, 90); beep(700, 0.05, "triangle", 0.10); }
  function sHit()   { beep(520, 0.10, "square", 0.16, 180); }
  function sGold()  { beep(700, 0.09, "square", 0.16); setTimeout(() => beep(1050, 0.12, "square", 0.16), 70); }
  function sEmpty() { beep(120, 0.06, "square", 0.12); }
  function sReload(){ beep(300, 0.05, "triangle", 0.12, 500); }
  function sLose()  { beep(200, 0.4, "sawtooth", 0.2, 60); }
  function sOver()  { beep(300, 0.2, "square", 0.2, 120); setTimeout(() => beep(150, 0.5, "sawtooth", 0.2, 70), 180); }

  // ---------- المقاس ----------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (state.clouds.length === 0) initClouds();
  }
  window.addEventListener("resize", resize);

  function initClouds() {
    state.clouds = [];
    const n = 5;
    for (let i = 0; i < n; i++) {
      state.clouds.push({
        x: Math.random() * W,
        y: 40 + Math.random() * (H * 0.45),
        s: 0.6 + Math.random() * 0.9,
        v: 6 + Math.random() * 12,
      });
    }
  }

  // ---------- الطيور ----------
  const BIRD_COLORS = [
    { body: "#e2493b", wing: "#b5342a", belly: "#f6c6a0" },
    { body: "#3b6fe2", wing: "#2a4fb0", belly: "#bcd4f6" },
    { body: "#3fae5a", wing: "#2e8443", belly: "#cdeecf" },
    { body: "#8a5cd6", wing: "#6a3fb0", belly: "#e0d0f6" },
  ];

  function spawnBird() {
    const d = DIFF[state.diff];
    const fromLeft = Math.random() < 0.5;
    const waveBoost = 1 + (state.wave - 1) * 0.08;
    const gold = Math.random() < 0.12;
    const size = gold ? 30 : (24 + Math.random() * 12);
    const baseSpeed = (70 + Math.random() * 60) * d.speed * waveBoost * (gold ? 1.35 : 1);
    const y = 60 + Math.random() * (H * 0.62);
    state.birds.push({
      x: fromLeft ? -60 : W + 60,
      y,
      vx: (fromLeft ? 1 : -1) * baseSpeed,
      vy: (Math.random() - 0.5) * 40,
      baseY: y,
      amp: 12 + Math.random() * 26,
      phase: Math.random() * Math.PI * 2,
      freq: 2 + Math.random() * 2,
      size,
      flap: Math.random() * Math.PI * 2,
      dir: fromLeft ? 1 : -1,
      gold,
      color: BIRD_COLORS[(Math.random() * BIRD_COLORS.length) | 0],
      dead: false,
      dieT: 0,
    });
  }

  // ---------- بدء / إنهاء ----------
  function startGame() {
    const d = DIFF[state.diff];
    state.scene = "play";
    state.score = 0;
    state.lives = 3;
    state.maxAmmo = d.ammo;
    state.ammo = d.ammo;
    state.reloadT = 0;
    state.wave = 1;
    state.birds = [];
    state.particles = [];
    state.floaters = [];
    state.spawnT = 0.4;
    state.time = 0;
    state.combo = 0;
    state.comboT = 0;
    hide("startScreen"); hide("settingsScreen"); hide("overScreen");
    ac();
  }

  function gameOver() {
    state.scene = "over";
    sOver();
    if (state.score > state.best) {
      state.best = state.score;
      try { localStorage.setItem("birdhunter_best", String(state.best)); } catch (e) {}
    }
    document.getElementById("finalScore").textContent = "النتيجة: " + state.score;
    document.getElementById("bestScore").textContent = "أفضل نتيجة: " + state.best;
    show("overScreen");
  }

  // ---------- التصويب ----------
  function shootAt(px, py) {
    if (state.scene !== "play") return;
    if (state.ammo <= 0) { sEmpty(); return; }
    state.ammo--;
    sShoot();
    state.shakeT = 0.12;
    muzzle(px, py);

    // إيجاد أقرب طائر ضمن مدى الضغط
    let hit = null, bestD = Infinity;
    for (const b of state.birds) {
      if (b.dead) continue;
      const r = b.size + 18;
      const dx = b.x - px, dy = b.y - py;
      const dd = dx * dx + dy * dy;
      if (dd < r * r && dd < bestD) { bestD = dd; hit = b; }
    }

    if (hit) {
      hit.dead = true;
      hit.dieT = 0;
      hit.vy = 60;                // يسقط
      hit.vx *= 0.3;
      state.combo++;
      state.comboT = 1.4;
      const base = hit.gold ? 30 : 10;
      const bonus = Math.min(state.combo, 5);
      const gained = base + (bonus - 1) * 5;
      state.score += gained;
      burst(hit.x, hit.y, hit.gold ? "#ffd23f" : hit.color.body, hit.gold ? 22 : 14);
      floater(hit.x, hit.y - hit.size, "+" + gained, hit.gold ? "#ffd23f" : "#fff");
      if (state.combo >= 2) floater(hit.x, hit.y + 6, "×" + state.combo, "#9be89b");
      hit.gold ? sGold() : sHit();
      // ذخيرة إضافية للطيور الذهبية
      if (hit.gold) state.ammo = Math.min(state.maxAmmo, state.ammo + 2);
    } else {
      state.combo = 0;
    }

    // إعادة تعبئة تلقائية عند نفاد الذخيرة
    if (state.ammo <= 0) state.reloadT = 1.1;
  }

  function muzzle(x, y) {
    for (let i = 0; i < 6; i++) {
      state.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 220,
        vy: (Math.random() - 0.5) * 220,
        life: 0.25, max: 0.25, r: 2 + Math.random() * 3,
        c: "#fff3b0",
      });
    }
  }
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 180;
      state.particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
        life: 0.5 + Math.random() * 0.4, max: 0.9,
        r: 2 + Math.random() * 4, c: color, grav: 320,
      });
    }
  }
  function floater(x, y, text, color) {
    state.floaters.push({ x, y, text, color, life: 0.9, max: 0.9 });
  }

  // ---------- التحديث ----------
  function update(dt) {
    state.time += dt;

    // سحب
    for (const c of state.clouds) {
      c.x -= c.v * dt;
      if (c.x < -160 * c.s) { c.x = W + 120 * c.s; c.y = 40 + Math.random() * (H * 0.45); }
    }

    if (state.scene === "play") {
      // إنتاج الطيور + الموجات
      state.spawnT -= dt;
      const d = DIFF[state.diff];
      const spawnInterval = Math.max(0.4, d.spawn - state.wave * 0.03);
      if (state.spawnT <= 0) {
        spawnBird();
        if (Math.random() < 0.15 + state.wave * 0.01) spawnBird();
        state.spawnT = spawnInterval * (0.7 + Math.random() * 0.6);
      }
      state.wave = 1 + Math.floor(state.time / 15);

      // إعادة التعبئة
      if (state.ammo <= 0 && state.reloadT > 0) {
        state.reloadT -= dt;
        if (state.reloadT <= 0) { state.ammo = state.maxAmmo; sReload(); }
      }

      // كومبو
      if (state.comboT > 0) { state.comboT -= dt; if (state.comboT <= 0) state.combo = 0; }

      // الطيور
      for (const b of state.birds) {
        if (b.dead) {
          b.dieT += dt;
          b.vy += 900 * dt;              // جاذبية السقوط
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.flap += dt * 4;
        } else {
          b.x += b.vx * dt;
          b.phase += b.freq * dt;
          b.baseY += b.vy * dt;
          if (b.baseY < 40) { b.baseY = 40; b.vy = Math.abs(b.vy); }
          if (b.baseY > H * 0.7) { b.baseY = H * 0.7; b.vy = -Math.abs(b.vy); }
          b.y = b.baseY + Math.sin(b.phase) * b.amp;
          b.flap += dt * 14;
          // هروب
          if ((b.dir === 1 && b.x > W + 70) || (b.dir === -1 && b.x < -70)) {
            b._escaped = true;
          }
        }
      }

      // معالجة الهروب/الحذف
      const survivors = [];
      let lostLife = false;
      for (const b of state.birds) {
        if (b._escaped) {
          state.lives -= DIFF[state.diff].escapePenalty;
          lostLife = true;
          state.combo = 0;
          continue;
        }
        if (b.dead && b.y > H + 80) continue;
        survivors.push(b);
      }
      state.birds = survivors;
      if (lostLife) {
        state.shakeT = 0.25;
        sLose();
        floater(W / 2, H * 0.4, "-❤️", "#ff6b5a");
        if (state.lives <= 0) { state.lives = 0; gameOver(); }
      }
    }

    // الجسيمات
    for (const p of state.particles) {
      p.life -= dt;
      if (p.grav) p.vy += p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    state.particles = state.particles.filter(p => p.life > 0);

    // النصوص المتطايرة
    for (const f of state.floaters) { f.life -= dt; f.y -= 40 * dt; }
    state.floaters = state.floaters.filter(f => f.life > 0);

    if (state.shakeT > 0) state.shakeT -= dt;
  }

  // ---------- الرسم ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#4a9fe0");
    g.addColorStop(0.55, "#8ecbf0");
    g.addColorStop(1, "#d8f0ff");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // شمس
    ctx.save();
    ctx.globalAlpha = 0.9;
    const sx = W * 0.82, sy = H * 0.18, sr = 46;
    const sg = ctx.createRadialGradient(sx, sy, 6, sx, sy, sr * 2.4);
    sg.addColorStop(0, "rgba(255,246,190,.95)");
    sg.addColorStop(0.3, "rgba(255,230,140,.55)");
    sg.addColorStop(1, "rgba(255,230,140,0)");
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(sx, sy, sr * 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff4c2";
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // سحب
    for (const c of state.clouds) drawCloud(c.x, c.y, c.s);

    // مروج في الأسفل
    const gh = H * 0.14;
    const gg = ctx.createLinearGradient(0, H - gh, 0, H);
    gg.addColorStop(0, "#7fc95a");
    gg.addColorStop(1, "#4f9e38");
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.moveTo(0, H - gh + 8);
    for (let x = 0; x <= W; x += 40) {
      ctx.quadraticCurveTo(x + 20, H - gh - 6, x + 40, H - gh + 8);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  }

  function drawCloud(x, y, s) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = "rgba(255,255,255,.9)";
    const parts = [[0, 0, 26], [26, 6, 20], [-26, 6, 22], [10, -12, 20], [-8, -10, 16]];
    for (const [dx, dy, r] of parts) { ctx.beginPath(); ctx.arc(dx, dy, r, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillRect(-30, 4, 62, 16);
    ctx.restore();
  }

  function drawBird(b) {
    const wingUp = Math.sin(b.flap) * 0.9;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(b.dir, 1);
    if (b.dead) ctx.rotate(Math.min(b.dieT * 6, Math.PI));

    const s = b.size / 30;
    ctx.scale(s, s);

    // هالة الذهبي
    if (b.gold && !b.dead) {
      ctx.save();
      ctx.globalAlpha = 0.4 + Math.sin(state.time * 6) * 0.15;
      const gg = ctx.createRadialGradient(0, 0, 4, 0, 0, 44);
      gg.addColorStop(0, "rgba(255,215,63,.9)");
      gg.addColorStop(1, "rgba(255,215,63,0)");
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(0, 0, 44, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    const body = b.gold ? "#ffcf33" : b.color.body;
    const wing = b.gold ? "#e0a800" : b.color.wing;
    const belly = b.gold ? "#fff1a8" : b.color.belly;

    // ذيل
    ctx.fillStyle = wing;
    ctx.beginPath();
    ctx.moveTo(-16, -2); ctx.lineTo(-34, -12); ctx.lineTo(-34, 8); ctx.closePath(); ctx.fill();

    // جسم
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.ellipse(0, 0, 20, 14, 0, 0, Math.PI * 2); ctx.fill();
    // بطن
    ctx.fillStyle = belly;
    ctx.beginPath(); ctx.ellipse(2, 5, 13, 8, 0, 0, Math.PI * 2); ctx.fill();

    // جناح خلفي
    ctx.fillStyle = wing;
    ctx.beginPath();
    ctx.moveTo(-2, -2);
    ctx.quadraticCurveTo(-18, -10 - wingUp * 16, -4, -20 - wingUp * 10);
    ctx.quadraticCurveTo(2, -8, -2, -2);
    ctx.fill();

    // رأس
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(16, -6, 11, 0, Math.PI * 2); ctx.fill();

    // منقار
    ctx.fillStyle = "#ff9a1f";
    ctx.beginPath();
    ctx.moveTo(26, -8); ctx.lineTo(38, -5); ctx.lineTo(26, -2); ctx.closePath(); ctx.fill();

    // عين
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(19, -8, 3.4, 0, Math.PI * 2); ctx.fill();
    if (b.dead) {
      ctx.lineWidth = 1.6; ctx.strokeStyle = "#000";
      ctx.beginPath(); ctx.moveTo(17, -10); ctx.lineTo(21, -6);
      ctx.moveTo(21, -10); ctx.lineTo(17, -6); ctx.stroke();
    } else {
      ctx.fillStyle = "#222";
      ctx.beginPath(); ctx.arc(20, -8, 1.7, 0, Math.PI * 2); ctx.fill();
    }

    // جناح أمامي
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-14, 8 + wingUp * 18, 2, 18 + wingUp * 10);
    ctx.quadraticCurveTo(8, 6, 0, 0);
    ctx.fill();

    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.save();
    // النتيجة
    ctx.textAlign = "right";
    ctx.font = "900 26px -apple-system, Tahoma, Arial";
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.fillText("النقاط " + state.score, W - 16 + 1, 38 + 1);
    ctx.fillStyle = "#fff";
    ctx.fillText("النقاط " + state.score, W - 16, 38);

    // الموجة
    ctx.font = "800 16px -apple-system, Tahoma, Arial";
    ctx.fillStyle = "rgba(255,255,255,.92)";
    ctx.fillText("الموجة " + state.wave, W - 16, 62);

    // القلوب (يسار)
    ctx.textAlign = "left";
    ctx.font = "22px Arial";
    let hearts = "";
    for (let i = 0; i < 3; i++) hearts += i < state.lives ? "❤️" : "🖤";
    ctx.fillText(hearts, 14, 36);

    // الذخيرة (أسفل يسار)
    const ax = 16, ay = H - 20;
    if (state.ammo <= 0) {
      ctx.textAlign = "left";
      ctx.fillStyle = "#ffd23f";
      ctx.font = "900 18px -apple-system, Tahoma, Arial";
      ctx.fillText("… إعادة تعبئة", ax, ay - 22);
    }
    // رصاصات
    const bw = 8, bh = 18, gap = 5;
    for (let i = 0; i < state.maxAmmo; i++) {
      const x = ax + i * (bw + gap);
      const y = ay - bh;
      const filled = i < state.ammo;
      ctx.fillStyle = filled ? "#ffcf33" : "rgba(255,255,255,.25)";
      roundRect(x, y, bw, bh, 3); ctx.fill();
      if (filled) {
        ctx.fillStyle = "#ff9a1f";
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x + bw, y); ctx.lineTo(x + bw / 2, y - 5);
        ctx.closePath(); ctx.fill();
      }
    }

    ctx.restore();
  }

  function render() {
    ctx.save();
    if (state.shakeT > 0) {
      const m = state.shakeT * 40;
      ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
    }

    drawSky();

    for (const b of state.birds) drawBird(b);

    // جسيمات
    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // نصوص متطايرة
    ctx.textAlign = "center";
    for (const f of state.floaters) {
      ctx.globalAlpha = Math.max(0, f.life / f.max);
      ctx.font = "900 26px -apple-system, Tahoma, Arial";
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.5)";
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    if (state.scene === "play") drawHUD();
  }

  // ---------- الحلقة ----------
  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ---------- المدخلات ----------
  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches && e.touches[0] ? e.touches[0] : (e.changedTouches && e.changedTouches[0]) || e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }
  function onDown(e) {
    if (state.scene !== "play") return;
    e.preventDefault();
    const p = pointerPos(e);
    shootAt(p.x, p.y);
  }
  canvas.addEventListener("mousedown", onDown);
  canvas.addEventListener("touchstart", onDown, { passive: false });

  // ---------- الواجهة ----------
  function show(id) { document.getElementById(id).classList.remove("hidden"); }
  function hide(id) { document.getElementById(id).classList.add("hidden"); }

  document.getElementById("playBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);
  document.getElementById("menuBtn").addEventListener("click", () => {
    state.scene = "start"; hide("overScreen"); show("startScreen");
  });
  document.getElementById("settingsBtn").addEventListener("click", () => {
    hide("startScreen"); show("settingsScreen");
  });
  document.getElementById("backBtn").addEventListener("click", () => {
    hide("settingsScreen"); show("startScreen");
  });

  const soundToggle = document.getElementById("soundToggle");
  soundToggle.classList.toggle("on", state.sound);
  soundToggle.addEventListener("click", () => {
    state.sound = !state.sound;
    soundToggle.classList.toggle("on", state.sound);
    try { localStorage.setItem("birdhunter_sound", state.sound ? "1" : "0"); } catch (e) {}
    if (state.sound) sReload();
  });

  const diffSeg = document.getElementById("diffSeg");
  diffSeg.querySelectorAll("button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.d === state.diff);
    btn.addEventListener("click", () => {
      state.diff = btn.dataset.d;
      diffSeg.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      try { localStorage.setItem("birdhunter_diff", state.diff); } catch (e) {}
    });
  });

  // ---------- الإقلاع ----------
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

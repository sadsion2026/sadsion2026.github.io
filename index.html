<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0b0f1a" />
<title>ركض الزومبي — Zombie Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0b0f1a; touch-action: none; overscroll-behavior: none;
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #game { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }

  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    color: #e8eefc; z-index: 10; padding: env(safe-area-inset-top) 6vw env(safe-area-inset-bottom);
    background: radial-gradient(circle at 50% 35%, rgba(40,60,110,.55), rgba(8,11,20,.92) 70%);
    backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: clamp(34px, 9vw, 78px); font-weight: 900; letter-spacing: 1px;
    color: #8effc1; text-shadow: 0 0 22px rgba(80,255,170,.55), 0 4px 0 #06351f;
    margin-bottom: 8px; line-height: 1.05;
  }
  .subtitle { font-size: clamp(14px, 3.6vw, 22px); color: #9fb2d8; margin-bottom: 26px; }
  .btn {
    font-size: clamp(20px, 5.2vw, 30px); font-weight: 800; color: #062417;
    background: linear-gradient(180deg, #9bffcb, #34d98a);
    border: none; border-radius: 18px; padding: 16px 44px; cursor: pointer;
    box-shadow: 0 8px 0 #1c8a55, 0 14px 26px rgba(0,0,0,.4); transition: transform .06s, box-shadow .06s;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #1c8a55, 0 8px 14px rgba(0,0,0,.4); }
  .hint {
    margin-top: 26px; font-size: clamp(13px, 3.3vw, 18px); color: #c7d4f0;
    line-height: 1.9; max-width: 560px;
  }
  .hint b { color: #8effc1; }
  .score-big { font-size: clamp(26px, 7vw, 48px); font-weight: 900; color: #ffd86b; margin: 6px 0 2px; }
  .best { color: #9fb2d8; font-size: clamp(14px, 3.6vw, 20px); margin-bottom: 22px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- شاشة البداية -->
<div id="startScreen" class="overlay">
  <div class="title">ركض الزومبي</div>
  <div class="subtitle">اركض بلا نهاية وقاتل الزومبي 🧟</div>
  <button id="startBtn" class="btn">ابدأ اللعب</button>
  <div class="hint">
    اللاعب يركض <b>تلقائياً</b> — وأنت تتحكم بالباقي:<br>
    👆 المس <b>يمين الشاشة</b> للقفز<br>
    👆 المس <b>يسار الشاشة</b> لإطلاق النار 🔫<br>
    اقفز فوق الزومبي أو أطلق عليه. لا تصطدم به!
  </div>
</div>

<!-- شاشة النهاية -->
<div id="gameOverScreen" class="overlay hidden">
  <div class="title" style="color:#ff7b7b; text-shadow:0 0 22px rgba(255,90,90,.5),0 4px 0 #4a0d0d;">انتهت اللعبة</div>
  <div class="score-big">النتيجة: <span id="finalScore">0</span></div>
  <div class="best">أفضل نتيجة: <span id="bestScore">0</span></div>
  <button id="restartBtn" class="btn">العب مرة أخرى</button>
  <div class="hint">يمين = قفز · يسار = إطلاق نار</div>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  // ===== أبعاد متجاوبة (Responsive) =====
  // نصمم اللعبة في عالم افتراضي ثابت ونحوّله ليملأ الشاشة بأي حجم/نسبة.
  const WORLD_W = 960;   // عرض العالم الافتراضي
  const WORLD_H = 540;   // ارتفاع العالم الافتراضي
  let scale = 1, offsetX = 0, offsetY = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const cssW = window.innerWidth;
    const cssH = window.innerHeight;
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    canvas.width = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);

    // نستخدم "تغطية" (cover): نكبّر للأكبر حتى يملأ الشاشة بالكامل
    scale = Math.max(cssW / WORLD_W, cssH / WORLD_H);
    offsetX = (cssW - WORLD_W * scale) / 2;
    offsetY = (cssH - WORLD_H * scale) / 2;
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 200));
  resize();

  // تحويل إحداثيات اللمس/النقر إلى إحداثيات العالم
  function toWorld(clientX, clientY) {
    return {
      x: (clientX - offsetX) / scale,
      y: (clientY - offsetY) / scale,
    };
  }

  // ===== حالة اللعبة =====
  const GROUND_Y = WORLD_H - 90; // مستوى الأرض
  const State = { MENU: 0, PLAY: 1, OVER: 2 };
  let state = State.MENU;

  let best = parseInt(localStorage.getItem("zombieRunBest") || "0", 10);

  const game = {
    speed: 6,
    baseSpeed: 6,
    distance: 0,
    score: 0,
    kills: 0,
    spawnTimer: 0,
    spawnGap: 95,
    shootCooldown: 0,
    time: 0,
  };

  // ===== اللاعب =====
  const player = {
    x: 180, y: GROUND_Y, w: 46, h: 70,
    vy: 0, onGround: true, jumps: 0,
    runFrame: 0, muzzle: 0,
  };
  const GRAVITY = 0.9;
  const JUMP_V = -16.5;
  const MAX_JUMPS = 2; // قفزة مزدوجة

  const zombies = [];   // الأعداء
  const bullets = [];   // الرصاص
  const particles = []; // مؤثرات (دم/شرر)
  const clouds = [];    // غيوم خلفية
  const bgBuildings = []; // مبانٍ خلفية

  // غيوم ومباني للخلفية (بارالاكس)
  for (let i = 0; i < 6; i++) {
    clouds.push({ x: Math.random() * WORLD_W, y: 40 + Math.random() * 140, s: 0.4 + Math.random() * 0.5, r: 30 + Math.random() * 40 });
  }
  for (let i = 0; i < 10; i++) {
    bgBuildings.push({ x: i * 130 + Math.random() * 40, w: 70 + Math.random() * 60, h: 120 + Math.random() * 160 });
  }

  function resetGame() {
    game.speed = game.baseSpeed = 6;
    game.distance = 0; game.score = 0; game.kills = 0;
    game.spawnTimer = 0; game.spawnGap = 95; game.shootCooldown = 0; game.time = 0;
    player.y = GROUND_Y; player.vy = 0; player.onGround = true; player.jumps = 0;
    zombies.length = 0; bullets.length = 0; particles.length = 0;
  }

  // ===== التحكم =====
  function jump() {
    if (player.jumps < MAX_JUMPS) {
      player.vy = JUMP_V;
      player.onGround = false;
      player.jumps++;
      for (let i = 0; i < 8; i++) {
        particles.push({ x: player.x, y: player.y, vx: (Math.random()-0.5)*4, vy: Math.random()*3+1, life: 18, c: "#cfe", r: 3 });
      }
    }
  }

  function shoot() {
    if (game.shootCooldown > 0) return;
    game.shootCooldown = 12;
    player.muzzle = 6;
    bullets.push({ x: player.x + player.w/2, y: player.y - player.h*0.55, vx: 16, r: 6 });
  }

  function handlePress(clientX) {
    if (state !== State.PLAY) return;
    // النصف الأيمن من الشاشة = قفز ، النصف الأيسر = إطلاق نار
    if (clientX > window.innerWidth / 2) jump();
    else shoot();
  }

  // أحداث اللمس واللوحة
  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) handlePress(t.clientX);
  }, { passive: false });

  canvas.addEventListener("mousedown", (e) => {
    e.preventDefault();
    handlePress(e.clientX);
  });

  window.addEventListener("keydown", (e) => {
    if (state !== State.PLAY) return;
    if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); jump(); }
    if (e.code === "ArrowDown" || e.code === "KeyF" || e.code === "Enter") { e.preventDefault(); shoot(); }
  });

  // ===== أعداء =====
  function spawnZombie() {
    const tall = Math.random() < 0.35;
    const h = tall ? 86 : 64;
    const w = 44;
    zombies.push({
      x: WORLD_W + 40, y: GROUND_Y, w, h,
      hp: tall ? 2 : 1, hurt: 0, wob: Math.random() * Math.PI * 2,
    });
  }

  // ===== الحلقة الرئيسية =====
  function update() {
    game.time++;

    // خلفية متحركة
    for (const c of clouds) {
      c.x -= c.s * game.speed * 0.25;
      if (c.x < -80) { c.x = WORLD_W + 80; c.y = 40 + Math.random() * 140; }
    }
    for (const b of bgBuildings) {
      b.x -= game.speed * 0.4;
      if (b.x + b.w < -20) { b.x = WORLD_W + 20; b.h = 120 + Math.random() * 160; }
    }

    if (state !== State.PLAY) return;

    // تسارع تدريجي للصعوبة
    game.baseSpeed = 6 + game.distance / 900;
    game.speed = game.baseSpeed;
    game.distance += game.speed;
    game.score = Math.floor(game.distance / 10) + game.kills * 25;

    if (game.shootCooldown > 0) game.shootCooldown--;
    if (player.muzzle > 0) player.muzzle--;

    // فيزياء اللاعب
    player.vy += GRAVITY;
    player.y += player.vy;
    if (player.y >= GROUND_Y) {
      player.y = GROUND_Y; player.vy = 0; player.onGround = true; player.jumps = 0;
    }
    player.runFrame += game.speed * 0.06;

    // توليد الزومبي
    game.spawnTimer++;
    const gap = Math.max(45, game.spawnGap - game.distance / 200);
    if (game.spawnTimer >= gap) {
      game.spawnTimer = 0;
      spawnZombie();
      if (Math.random() < 0.18 && game.distance > 1500) {
        // أحياناً يأتي زومبي ثانٍ قريب لزيادة الصعوبة
        zombies.push({ x: WORLD_W + 40 + 70, y: GROUND_Y, w: 44, h: 64, hp: 1, hurt: 0, wob: Math.random()*6 });
      }
    }

    // تحريك الرصاص
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx;
      if (b.x > WORLD_W + 30) bullets.splice(i, 1);
    }

    // تحريك الزومبي + تصادمات
    for (let i = zombies.length - 1; i >= 0; i--) {
      const z = zombies[i];
      z.x -= game.speed * 1.02;
      z.wob += 0.2;
      if (z.hurt > 0) z.hurt--;

      // تصادم مع الرصاص
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (b.x + b.r > z.x - z.w/2 && b.x - b.r < z.x + z.w/2 &&
            b.y > z.y - z.h && b.y < z.y) {
          bullets.splice(j, 1);
          z.hp--; z.hurt = 8;
          spawnBlood(b.x, b.y);
          if (z.hp <= 0) {
            killZombie(i, z);
            break;
          }
        }
      }
      if (z.hp <= 0) continue;

      // تصادم مع اللاعب
      const px1 = player.x - player.w/2 + 6, px2 = player.x + player.w/2 - 6;
      const py1 = player.y - player.h, py2 = player.y;
      const zx1 = z.x - z.w/2 + 6, zx2 = z.x + z.w/2 - 6;
      const zy1 = z.y - z.h, zy2 = z.y;
      if (px2 > zx1 && px1 < zx2 && py2 > zy1 && py1 < zy2) {
        // اصطدام: لكن إن كان اللاعب نازلاً فوق رأس الزومبي = دهس
        if (player.vy > 4 && py2 - z.h * 0.5 < zy1 + 14) {
          killZombie(i, z);
          player.vy = JUMP_V * 0.7; // ارتداد
          player.jumps = 1;
          continue;
        }
        gameOver();
        return;
      }

      if (z.x < -60) zombies.splice(i, 1);
    }

    // مؤثرات
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function killZombie(index, z) {
    zombies.splice(index, 1);
    game.kills++;
    spawnBlood(z.x, z.y - z.h/2, 18);
    // نص نقاط طائر
    particles.push({ x: z.x, y: z.y - z.h, vx: 0, vy: -1.2, life: 40, text: "+25", c: "#ffd86b" });
  }

  function spawnBlood(x, y, n = 10) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x, y, vx: (Math.random()-0.5)*7, vy: (Math.random()-0.8)*6,
        life: 24 + Math.random()*16, c: Math.random() < 0.7 ? "#5fe08a" : "#37c46c", r: 2 + Math.random()*3,
      });
    }
  }

  // ===== الرسم =====
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // تعبئة كامل الشاشة باللون الخلفي (للأشرطة عند نسب غريبة)
    ctx.fillStyle = "#0b0f1a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // نطبّق التحويل للعالم الافتراضي
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offsetX * dpr, offsetY * dpr);

    drawSky();
    drawBackground();
    drawGround();
    drawParticles(false);
    drawBullets();
    drawZombies();
    drawPlayer();
    drawParticles(true);
    drawHUD();
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, WORLD_H);
    g.addColorStop(0, "#1a2a52");
    g.addColorStop(0.5, "#2a3f73");
    g.addColorStop(1, "#46336b");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);

    // قمر
    ctx.fillStyle = "rgba(255,250,220,0.9)";
    ctx.beginPath(); ctx.arc(WORLD_W - 130, 100, 46, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#2a3f73";
    ctx.beginPath(); ctx.arc(WORLD_W - 110, 88, 40, 0, Math.PI*2); ctx.fill();

    // غيوم
    ctx.fillStyle = "rgba(180,195,235,0.25)";
    for (const c of clouds) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
      ctx.arc(c.x + c.r*0.8, c.y + 6, c.r*0.7, 0, Math.PI*2);
      ctx.arc(c.x - c.r*0.8, c.y + 8, c.r*0.6, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawBackground() {
    // مبانٍ مظلمة في الخلفية
    ctx.fillStyle = "#1c2747";
    for (const b of bgBuildings) {
      ctx.fillRect(b.x, GROUND_Y - b.h, b.w, b.h);
      // نوافذ
      ctx.fillStyle = "rgba(255,210,120,0.5)";
      for (let wy = GROUND_Y - b.h + 14; wy < GROUND_Y - 14; wy += 24) {
        for (let wx = b.x + 10; wx < b.x + b.w - 10; wx += 20) {
          if ((Math.floor(wx + wy) % 3) === 0) ctx.fillRect(wx, wy, 8, 12);
        }
      }
      ctx.fillStyle = "#1c2747";
    }
  }

  function drawGround() {
    ctx.fillStyle = "#20351f";
    ctx.fillRect(0, GROUND_Y, WORLD_W, WORLD_H - GROUND_Y);
    ctx.fillStyle = "#2d4a2b";
    ctx.fillRect(0, GROUND_Y, WORLD_W, 10);

    // خطوط الأرض المتحركة لإيحاء السرعة
    ctx.strokeStyle = "rgba(120,180,110,0.35)";
    ctx.lineWidth = 4;
    const off = (game.distance % 80);
    for (let x = -off; x < WORLD_W; x += 80) {
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 35);
      ctx.lineTo(x + 30, GROUND_Y + 35);
      ctx.stroke();
    }
  }

  function drawPlayer() {
    const x = player.x, y = player.y;
    const legSwing = Math.sin(player.runFrame) * 10;
    const grounded = player.onGround;

    ctx.save();
    // ظل
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(x, GROUND_Y + 4, 26, 7, 0, 0, Math.PI*2);
    ctx.fill();

    // أرجل
    ctx.strokeStyle = "#2a4d8f"; ctx.lineWidth = 9; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x, y - 26);
    ctx.lineTo(x - (grounded ? legSwing : 8), y);
    ctx.moveTo(x, y - 26);
    ctx.lineTo(x + (grounded ? legSwing : -6), y);
    ctx.stroke();

    // جذع
    ctx.fillStyle = "#3a72d4";
    ctx.beginPath();
    roundRect(x - 16, y - 56, 32, 34, 8);
    ctx.fill();

    // ذراع + بندقية
    ctx.strokeStyle = "#2a4d8f"; ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(x, y - 48);
    ctx.lineTo(x + 26, y - 44);
    ctx.stroke();
    // بندقية
    ctx.fillStyle = "#3a3f4d";
    ctx.fillRect(x + 22, y - 49, 26, 8);
    ctx.fillRect(x + 18, y - 47, 8, 14);
    if (player.muzzle > 0) {
      ctx.fillStyle = "#ffd86b";
      ctx.beginPath();
      ctx.arc(x + 52, y - 45, 7 + Math.random()*3, 0, Math.PI*2);
      ctx.fill();
    }

    // رأس
    ctx.fillStyle = "#f3c79a";
    ctx.beginPath();
    ctx.arc(x, y - 66, 13, 0, Math.PI*2);
    ctx.fill();
    // خوذة
    ctx.fillStyle = "#2f7d4f";
    ctx.beginPath();
    ctx.arc(x, y - 68, 14, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(x - 14, y - 69, 28, 5);
    ctx.restore();
  }

  function drawZombies() {
    for (const z of zombies) {
      const x = z.x, y = z.y, h = z.h;
      const sway = Math.sin(z.wob) * 4;
      ctx.save();
      // ظل
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.beginPath();
      ctx.ellipse(x, GROUND_Y + 4, 24, 6, 0, 0, Math.PI*2);
      ctx.fill();

      const body = z.hurt > 0 ? "#d6ffe0" : "#4f9e63";
      // أرجل
      ctx.strokeStyle = "#356b43"; ctx.lineWidth = 8; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x, y - h*0.4);
      ctx.lineTo(x - 8, y);
      ctx.moveTo(x, y - h*0.4);
      ctx.lineTo(x + 8, y);
      ctx.stroke();
      // جذع
      ctx.fillStyle = body;
      roundRect(x - 15 + sway*0.3, y - h*0.78, 30, h*0.45, 7);
      ctx.fill();
      // ذراعان ممدودتان للأمام (زومبي)
      ctx.strokeStyle = body; ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(x + sway*0.3, y - h*0.66);
      ctx.lineTo(x - 22, y - h*0.5);
      ctx.stroke();
      // رأس
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.arc(x + sway*0.4, y - h*0.86, 13, 0, Math.PI*2);
      ctx.fill();
      // عيون حمراء
      ctx.fillStyle = "#ff4444";
      ctx.beginPath(); ctx.arc(x - 5 + sway*0.4, y - h*0.88, 2.4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 3 + sway*0.4, y - h*0.88, 2.4, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  function drawBullets() {
    for (const b of bullets) {
      ctx.save();
      ctx.fillStyle = "#ffe27a";
      ctx.shadowColor = "#ffae42"; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, b.r + 4, b.r - 1, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawParticles(textPass) {
    for (const p of particles) {
      if (!!p.text !== textPass) continue;
      const a = Math.max(0, Math.min(1, p.life / 24));
      if (p.text) {
        ctx.globalAlpha = Math.min(1, p.life / 40);
        ctx.fillStyle = p.c;
        ctx.font = "bold 22px Arial";
        ctx.textAlign = "center";
        ctx.fillText(p.text, p.x, p.y);
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = a;
        ctx.fillStyle = p.c;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r || 3, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawHUD() {
    ctx.textAlign = "right";
    ctx.font = "bold 30px Arial";
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 6;
    ctx.fillText("النقاط: " + game.score, WORLD_W - 24, 46);
    ctx.font = "bold 22px Arial";
    ctx.fillStyle = "#8effc1";
    ctx.fillText("🧟 " + game.kills, WORLD_W - 24, 78);
    ctx.shadowBlur = 0;
  }

  // أداة مساعدة: مستطيل بزوايا دائرية
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ===== إدارة الشاشات =====
  const startScreen = document.getElementById("startScreen");
  const gameOverScreen = document.getElementById("gameOverScreen");
  const finalScoreEl = document.getElementById("finalScore");
  const bestScoreEl = document.getElementById("bestScore");

  function startGame() {
    resetGame();
    state = State.PLAY;
    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
  }

  function gameOver() {
    state = State.OVER;
    if (game.score > best) {
      best = game.score;
      localStorage.setItem("zombieRunBest", String(best));
    }
    finalScoreEl.textContent = game.score;
    bestScoreEl.textContent = best;
    gameOverScreen.classList.remove("hidden");
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("restartBtn").addEventListener("click", startGame);

  // حلقة الرسم
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
